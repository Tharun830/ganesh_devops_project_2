name: Ganesh DevOps Project 2 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint & Syntax Check
        run: |
          python -m py_compile app/main.py tests/test_main.py

      - name: Run Pytest
        run: |
          pytest -v --junitxml=junit-results.xml tests/

  docker-build:
    name: Build & Smoke Test Docker Container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ganesh-devops-project-2:${{ github.sha }} .

      - name: Run Container & Test Healthcheck
        run: |
          docker run -d --name ganesh-fastapi-test -p 8000:8000 ganesh-devops-project-2:${{ github.sha }}
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          docker stop ganesh-fastapi-test
