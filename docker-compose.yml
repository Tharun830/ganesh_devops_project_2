version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ganesh_devops_project_2:latest
    container_name: ganesh-devops-fastapi-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RUNNING_IN_DOCKER=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
